<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartCalcHub</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#36d1dc,#5b86e5);
    margin:0;
    padding:20px;
    color:white;
}

h1{
    text-align:center;
    font-size:50px;
}

.calculator{
    background:rgba(255,255,255,0.1);
    padding:20px;
    margin:20px auto;
    border-radius:15px;
    text-align:center;
    max-width:800px;
}

input{
    width:250px;
    padding:12px;
    margin:5px;
    border:none;
    border-radius:8px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#ff9800;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e68900;
}

</style>

</head>
<body>

<h1>SmartCalcHub</h1>

<div class="calculator">
<h2>Age Calculator</h2>
<input type="number" id="birthYear" placeholder="Enter Birth Year">
<button onclick="calculateAge()">Calculate Age</button>
<p id="ageResult"></p>
</div>

<div class="calculator">
<h2>BMI Calculator</h2>
<input type="number" id="weight" placeholder="Weight (kg)">
<input type="number" id="height" placeholder="Height (cm)">
<button onclick="calculateBMI()">Calculate BMI</button>
<p id="bmiResult"></p>
</div>

<div class="calculator">
<h2>Percentage Calculator</h2>
<input type="number" id="obtainedMarks" placeholder="Obtained Marks">
<input type="number" id="totalMarks" placeholder="Total Marks">
<button onclick="calculatePercentage()">Calculate Percentage</button>
<p id="percentageResult"></p>
</div>

<div class="calculator">
<h2>Password Generator</h2>
<button onclick="generatePassword()">Generate Password</button>
<p id="passwordResult"></p>
</div>

<script src="script.js"></script>

</body>
</html>
